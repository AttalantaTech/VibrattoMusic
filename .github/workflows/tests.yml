# Runs the type check and the automated tests on every pull request (and on
# development/main after a merge), so a change that breaks a business rule
# shows a red ✗ on the PR before it is merged
name: Tests

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]

# A new push to the same PR cancels the run still going for the old one
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Type check and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Tests
        run: npx vitest run src/
